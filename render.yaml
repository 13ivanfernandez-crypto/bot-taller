services:
  - type: web
    name: bot-taller
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn bot:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TALLER_NOMBRE
        value: MECACHAPI
      - key: MANTENER_DESPIERTO
        value: "si"
      - key: PYTHON_VERSION
        value: 3.12.7
